# GitHub Actions 工作流:Lychee 链接检查(注释为中文说明,原配置逻辑未改动)
name: lychee

# 触发条件:push、pull request,以及每月 1 日 0 点(UTC)的定时任务
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  # 唯一的任务:检查全部 Markdown 文件中的链接是否有效
  links:
    runs-on: ubuntu-latest
    steps:
    # 检出仓库代码
    - uses: actions/checkout@v6

    # 步骤一:链接检查器
    # 使用 Lychee 扫描 '**/*.md';--max-retries 4 表示失败链接最多重试 4 次,减少误报
    - name: Link Checker
      uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # master
      #env:
      #  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        args: --verbose --max-retries 4 --no-progress '**/*.md'

    # 步骤二:把 Lychee 输出的报告(./lychee/out.md)自动创建为 GitHub Issue
    # 仅当存在死链时才会生成报告;标签为 report 与 automated issue
    - name: Create Issue From File
      uses: peter-evans/create-issue-from-file@433e51abf769039ee20ba1293a088ca19d573b7f # v4
      with:
        title: Link Checker Report
        content-filepath: ./lychee/out.md
        labels: report, automated issue
